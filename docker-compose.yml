# VPS deploy — plain compose under /home/ubuntu/claude-assistant/.
# Matches the trade-webhook pattern (services/trade-webhook in elder-brain).
#
# Auth bootstrap (one-time, before `up -d`):
#   docker compose run --rm bot claude login
# That writes credentials into the claude_auth named volume; persists
# across rebuilds.
#
# Secrets live in /etc/claude-assistant/.env (chmod 600, not in git).

services:
  bot:
    build: .
    image: claude-assistant:local
    container_name: claude-assistant
    restart: unless-stopped
    env_file:
      - /etc/claude-assistant/.env
    environment:
      APPROVED_DIRECTORY: /home/ubuntu
      DATABASE_URL: sqlite:///data/bot.db
      API_SERVER_PORT: 8088
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - claude_auth:/root/.claude
      - claude_data:/app/data
      - /srv/lake:/srv/lake:rw
      - /home/ubuntu:/home/ubuntu:rw
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3).read()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  claude_auth:
  claude_data:

networks:
  dokploy-network:
    external: true
