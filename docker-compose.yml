# VPS deploy — plain compose under /home/ubuntu/elder-brain-bot/.
# Matches the trade-webhook pattern (services/trade-webhook in elder-brain).
#
# Naming note: the source repo is `IvPalmer/elder-brain-bot` (renamed
# from `claude-assistant` on 2026-05-10; originally a fork of
# RichardAtCT/claude-code-telegram). The deploy identity is
# `elder-brain-bot` — Telegram bot `@elder_brain_bot`, the container,
# the dir, the secrets path. The named volumes still carry the old
# `claude-assistant_*` prefix (declared external below) so we don't
# have to migrate auth state every time we rename.
#
# Auth bootstrap (one-time, before `up -d`):
#   docker compose run --rm bot claude
#   /login   (inside the resulting Claude Code session)
# That writes credentials into the claude-assistant_claude_auth volume;
# persists across rebuilds.
#
# Secrets live in /etc/elder-brain-bot/.env (chmod 600, ubuntu:ubuntu —
# NOT root, otherwise compose env_file fails with permission denied).

name: elder-brain-bot

services:
  bot:
    build: .
    image: elder-brain-bot:local
    container_name: elder-brain-bot
    restart: unless-stopped
    env_file:
      - /etc/elder-brain-bot/.env
    environment:
      # Bot's "approved working surface". Set to / so the bot can operate on
      # any project, whether it lives under /home/ubuntu (plain compose) or
      # /etc/dokploy (Dokploy-managed app/compose source clones). Container
      # is isolated; APPROVED_DIRECTORY just gates which paths the bot will
      # accept user commands against.
      APPROVED_DIRECTORY: /
      DATABASE_URL: sqlite:///data/bot.db
      API_SERVER_PORT: 8088
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - claude_auth:/root/.claude
      - claude_data:/app/data
      # Whisper model cache — populated on first voice msg, persists
      # across image rebuilds so we don't re-download ~500MB each time.
      - whisper_models:/root/.cache/whisper
      # Knowledge substrate.
      - /srv/lake:/srv/lake:rw
      # Plain-compose projects (crate-mate, dsrptv, master-trader, ocdj,
      # trade-webhook, veludo, elder-brain itself — all live here).
      - /home/ubuntu:/home/ubuntu:rw
      # Dokploy-managed app + compose source clones (ddd, disclaymer,
      # health, joberator, master-trader-stack, rlm-stack, vault-stack).
      # Without this mount the bot can't read or edit those projects.
      - /etc/dokploy:/etc/dokploy:rw
      # Docker socket — lets the bot run `docker compose`, restart
      # containers, build images, etc. directly. Unrestricted host control;
      # OK because this VPS runs only my own services.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          # Bumped from 1G → 2G: Whisper `small` transcription bursts
          # to ~1.5GB peak when loading the model + decoding a clip.
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  claude_auth:
    external: true
    name: claude-assistant_claude_auth
  claude_data:
    external: true
    name: claude-assistant_claude_data
  whisper_models:
    # Cache for openai-whisper model downloads (e.g. small.pt ~460MB).
    # Compose creates this on first up; persists across rebuilds.

networks:
  dokploy-network:
    external: true
